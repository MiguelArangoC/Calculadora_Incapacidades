<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calculadora de Incapacidades{% endblock %} - Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">⚖️</span>
                <span class="brand-title">Calculadora de Incapacidades</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Calcular</a>
                <a href="/casos" class="nav-link {% if request.path == '/casos' %}active{% endif %}">Historial de Casos</a>
                <a href="/buscar" class="nav-link {% if request.path == '/buscar' %}active{% endif %}">Buscar</a>
            </div>
        </div>
    </nav>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Simulador Académico de Incapacidades Laborales en Colombia &bull; Desarrollado con Flask</p>
    </footer>
</body>
</html>
